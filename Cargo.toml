[package]
name = "kreatilas"
description = "Find files by smell"
authors = ["BongoThirteen <mailbox@bongothirteen.net>"]
version = "0.1.0"
edition = "2024"

[[bin]]
name = "node"

[dependencies]
anyhow = "1.0.98"
bincode = "2.0.1"
blake3 = { version = "1.8.2", features = ["serde"] }
bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive"] }
colored = "3.0.0"
derive_more = { version = "2.0.1", features = ["debug"] }
ed25519-dalek = { version = "2.1.1", features = ["pkcs8", "pem"] }
futures = "0.3.31"
hex = "0.4.3"
iroh = "0.35.0"
iroh-base = { version = "0.90.0", features = ["ticket"] }
iroh-blobs = "0.35.0"
iroh-gossip = "0.35.0"
n0-future = "0.1.3"
nu-ansi-term = "0.50.1"
postcard = "1.1.1"
rand = "0.9.1"
rand_core = { version = "0.6.4" }
reedline = "0.40.0"
serde = { version = "1.0.219", features = ["derive"] }
shlex = "1.3.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
